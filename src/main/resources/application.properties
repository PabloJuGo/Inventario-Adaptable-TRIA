spring.application.name=InventarioAdaptableTRIA
server.port=${PORT:8080}

spring.datasource.url=jdbc:sqlite:${APP_DB_PATH:./data/inventario_adaptable.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.pool-name=TriaSQLitePool

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.web.resources.static-locations=file:./frontend/,classpath:/static/
spring.mvc.problemdetails.enabled=false

app.documents-path=${APP_DOCUMENTS_PATH:./data/documentos}
app.auth.token-ttl-hours=${APP_TOKEN_TTL_HOURS:12}

logging.level.org.springframework=WARN
logging.level.es.grupotria.inventario=INFO
